[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/player"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# o player roda o tempo todo: otimiza mesmo em dev para medir o consumo real
[profile.dev.package.dv360s-core]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
